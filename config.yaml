# Ehtobotti settings. Model names live here only, never in code.

provider: ollama            # ollama | azure_openai (stub, phase 3)

ollama:
  host: http://localhost:11434

models:
  default_chat: qwen3.5:4b
  embedding: bge-m3
  # Per-model options. think_supported: the model accepts the think flag (Qwen does,
  # Gemma errors if it is sent). think: let the model reason before answering;
  # usually more accurate on tricky questions but several times slower.
  chat:
    qwen3.5:4b:
      think_supported: true
      think: false
    gemma3:4b:
      think_supported: false
    qwen3:8b:
      think_supported: true
      think: false

generation:
  num_ctx: 4096
  temperature: 0.1
  # Fixed seed makes eval runs reproducible, so a change in results comes from a
  # change in code or prompt, not from sampling luck.
  seed: 42

chunking:
  max_tokens: 400
  # No tokenizer dependency: token count is estimated from characters.
  # bge-m3 averages roughly 4 characters per token on Finnish legal text.
  chars_per_token: 4
  # Headings longer than this are treated as body text (numbered list items etc.).
  max_heading_chars: 90

retrieval:
  top_k: 5

embedding:
  batch_size: 32

eval:
  # Must differ from the answering model so a model does not grade its own answers.
  judge_model: gemma3:4b
  # Used when the answering model is the same as judge_model.
  judge_fallback: qwen3.5:4b

paths:
  raw_dir: data/raw
  index_dir: data/index
  sources: data/sources.yaml
  questions: eval/questions.json
  results_dir: results

index:
  collection: vakuutusehdot

# Product keys used as folder names under data/raw/ and as the --product filter.
products:
  koti: Kotivakuutus
  auto: Autovakuutus
  matka: Matkavakuutus
  henkilo: Henkilö- ja tapaturmavakuutus
