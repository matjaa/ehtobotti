# Public source documents. PDFs are downloaded manually into data/raw/<product>/
# and are not committed. One entry per PDF; `file` is the path inside that folder
# (uploads from the UI go to a company subfolder, e.g. lahitapiola/ehdot.pdf).
#
# Example:
# - product: koti
#   file: kotivakuutusehdot.pdf
#   title: Kotivakuutusehdot
#   version: "1.1.2026"
#   url: https://example.com/kotivakuutusehdot.pdf
#   label: Kotivakuutus        # optional: name used in citations, default is the product name
#   company: Esimerkkiyhtiö     # insurer; the UI asks for company so terms of two insurers never mix
#
# Give each document of the same product its own label, otherwise citations
# like [Autovakuutus, s. 2] cannot tell the documents apart.

- product: auto
  file: Ajoneuvovakuutusehto 2026.pdf
  title: Ajoneuvovakuutuksen vakuutusehdot
  version: "1.1.2026"
  url: ""  # TODO: public URL of the PDF
  label: Autovakuutus
  company: LähiTapiola

